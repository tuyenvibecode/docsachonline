<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện - bản kiểm tra</title>
<style>
  /* TRANG TẠM để kiểm tra dữ liệu. UI thật sẽ làm sau theo design.md */
  :root { --bg:#faf8f4; --fg:#222; --muted:#777; --line:#e4dfd5; --accent:#8a5a2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1a18; --fg:#e8e4dc; --muted:#9a948a; --line:#34312c; --accent:#d9a066; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 Georgia, "Times New Roman", serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header small { color:var(--muted); }
  main { display:grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 50px); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  #list { border-right:1px solid var(--line); padding:8px; }
  .book { display:flex; gap:10px; padding:8px; border-radius:8px; cursor:pointer; align-items:center; }
  .book:hover, .book.active { background:var(--line); }
  .cover { width:44px; height:62px; flex:none; border-radius:4px; background:var(--line); object-fit:cover; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; }
  .book b { display:block; line-height:1.3; }
  .book span { color:var(--muted); font-size:13px; }
  #reader { padding:16px; max-width:720px; }
  #reader p { margin:0 0 1em; }
  .bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  button, select { font:inherit; font-size:14px; padding:6px 10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:6px; }
  button:disabled { opacity:.4; }
  .err { color:#c0392b; }
</style>
</head>
<body>
<header><b>Thư viện</b><small id="status">đang tải…</small></header>
<main>
  <aside id="list"></aside>
  <section id="reader"><p style="color:var(--muted)">Chọn một sách ở danh sách.</p></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let books = [];

// 1. Tải danh sách sách
fetch("books.json")
  .then((r) => r.json())
  .then((data) => {
    books = data.books || [];
    $("status").textContent = books.length + " sách";
    renderList();
  })
  .catch((e) => {
    $("status").innerHTML = '<span class="err">Không tải được books.json. Hãy chạy: python -m http.server 8000</span>';
  });

function renderList() {
  const box = $("list");
  box.textContent = "";
  books.forEach((b) => {
    const row = document.createElement("div");
    row.className = "book";
    row.dataset.id = b.id;

    let cover;
    if (b.cover) { cover = document.createElement("img"); cover.src = b.cover; cover.alt = ""; cover.loading = "lazy"; }
    else { cover = document.createElement("div"); cover.textContent = "no cover"; }
    cover.className = "cover";

    const info = document.createElement("div");
    const t = document.createElement("b"); t.textContent = b.title;
    const s = document.createElement("span"); s.textContent = b.author + " · " + b.chapters + " chương";
    info.append(t, s);

    row.append(cover, info);
    row.onclick = () => openBook(b, row);
    box.append(row);
  });
}

// 2. Chỉ tải file chữ của sách khi bấm vào
function loadBookScript(id) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "chapters/book-" + id + ".js";
    s.onload = () => { const r = { texts: window.__BOOK_TEXT__, titles: window.__BOOK_TITLES__ || {} }; s.remove(); resolve(r); };
    s.onerror = () => reject(new Error("Không tải được chapters/book-" + id + ".js"));
    document.head.append(s);
  });
}

async function openBook(b, row) {
  document.querySelectorAll(".book").forEach((e) => e.classList.remove("active"));
  row.classList.add("active");
  const reader = $("reader");
  reader.textContent = "Đang tải…";
  try {
    const { texts, titles } = await loadBookScript(b.id);
    const n = Object.keys(texts).length;
    let cur = 1;

    reader.textContent = "";
    const bar = document.createElement("div"); bar.className = "bar";
    const prev = document.createElement("button"); prev.textContent = "← Trước";
    const next = document.createElement("button"); next.textContent = "Sau →";
    const sel = document.createElement("select");
    for (let i = 1; i <= n; i++) {
      const o = document.createElement("option"); o.value = i; o.textContent = i + ". " + (titles[i] || "Chương " + i);
      sel.append(o);
    }
    bar.append(prev, sel, next);
    const h = document.createElement("h2");
    const body = document.createElement("div");
    reader.append(bar, h, body);

    const show = (i) => {
      cur = Math.min(Math.max(i, 1), n);
      sel.value = cur;
      h.textContent = titles[cur] || "Chương " + cur;
      body.textContent = "";
      (texts[cur] || "").split("\n\n").forEach((para) => {
        const p = document.createElement("p"); p.textContent = para; body.append(p);   // textContent: an toàn
      });
      prev.disabled = cur <= 1; next.disabled = cur >= n;
      window.scrollTo(0, 0);
    };
    prev.onclick = () => show(cur - 1);
    next.onclick = () => show(cur + 1);
    sel.onchange = () => show(+sel.value);
    show(1);
  } catch (e) {
    reader.innerHTML = '<p class="err"></p>';
    reader.firstChild.textContent = e.message;
  }
}
</script>
</body>
</html>
